name: Azure DevOps Integration
description: Integrates GitHub Actions with Azure DevOps for work item management and deployment tracking

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

env:
  AZURE_DEVOPS_ORG: dealndone2025
  AZURE_DEVOPS_PROJECT: DealNDone2025
  AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}

jobs:
  update-work-items:
    name: Update Azure DevOps Work Items
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get workflow run details
      id: workflow-run
      run: |
        echo "workflow_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
        echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
        echo "head_branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
        echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
    
    - name: Extract commit messages
      id: commit-messages
      run: |
        # Get commit messages from the workflow run
        COMMIT_MESSAGES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}" \
          | jq -r '.commit.message')
        echo "messages=$COMMIT_MESSAGES" >> $GITHUB_OUTPUT
    
    - name: Parse work item references
      id: work-items
      run: |
        # Extract work item IDs from commit messages (format: #123, US-123, ST-123)
        WORK_ITEMS=$(echo "${{ steps.commit-messages.outputs.messages }}" | grep -o '[A-Z]\+-[0-9]\+' | sort -u | tr '\n' ',' | sed 's/,$//')
        echo "work_items=$WORK_ITEMS" >> $GITHUB_OUTPUT
    
    - name: Update work items in Azure DevOps
      run: |
        if [ -n "${{ steps.work-items.outputs.work_items }}" ]; then
          IFS=',' read -ra WI_ARRAY <<< "${{ steps.work-items.outputs.work_items }}"
          
          for work_item in "${WI_ARRAY[@]}"; do
            echo "Updating work item: $work_item"
            
            # Determine the new state based on workflow conclusion
            if [ "${{ steps.workflow-run.outputs.conclusion }}" = "success" ]; then
              NEW_STATE="Resolved"
              COMMENT="✅ Deployment completed successfully for commit ${{ steps.workflow-run.outputs.head_sha }}"
            else
              NEW_STATE="Active"
              COMMENT="❌ Deployment failed for commit ${{ steps.workflow-run.outputs.head_sha }}"
            fi
            
            # Update work item state
            curl -X PATCH \
              "https://dev.azure.com/${{ env.AZURE_DEVOPS_ORG }}/${{ env.AZURE_DEVOPS_PROJECT }}/_apis/wit/workItems/$work_item?api-version=6.0" \
              -H "Authorization: Bearer ${{ env.AZURE_DEVOPS_PAT }}" \
              -H "Content-Type: application/json-patch+json" \
              -d "[{\"op\": \"add\", \"path\": \"/fields/System.State\", \"value\": \"$NEW_STATE\"}]"
            
            # Add comment to work item
            curl -X POST \
              "https://dev.azure.com/${{ env.AZURE_DEVOPS_ORG }}/${{ env.AZURE_DEVOPS_PROJECT }}/_apis/wit/workItems/$work_item/comments?api-version=6.0" \
              -H "Authorization: Bearer ${{ env.AZURE_DEVOPS_PAT }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$COMMENT\"}"
          done
        else
          echo "No work items found in commit messages"
        fi
    
    - name: Create deployment work item
      if: ${{ steps.workflow-run.outputs.conclusion == 'success' }}
      run: |
        # Create a deployment work item for tracking
        DEPLOYMENT_DATA=$(cat <<EOF
        [
          {
            "op": "add",
            "path": "/fields/System.Title",
            "value": "Deployment: ${{ steps.workflow-run.outputs.head_branch }} - ${{ steps.workflow-run.outputs.head_sha }}"
          },
          {
            "op": "add",
            "path": "/fields/System.Description",
            "value": "Deployment completed for branch ${{ steps.workflow-run.outputs.head_branch }} with commit ${{ steps.workflow-run.outputs.head_sha }}"
          },
          {
            "op": "add",
            "path": "/fields/System.State",
            "value": "Resolved"
          },
          {
            "op": "add",
            "path": "/fields/System.Tags",
            "value": "deployment, github-actions, ${{ steps.workflow-run.outputs.head_branch }}"
          }
        ]
        EOF
        )
        
        curl -X POST \
          "https://dev.azure.com/${{ env.AZURE_DEVOPS_ORG }}/${{ env.AZURE_DEVOPS_PROJECT }}/_apis/wit/workItems/\$Deployment?api-version=6.0" \
          -H "Authorization: Bearer ${{ env.AZURE_DEVOPS_PAT }}" \
          -H "Content-Type: application/json-patch+json" \
          -d "$DEPLOYMENT_DATA"

  notify-teams:
    name: Send Teams Notification
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Send Teams notification
      uses: skitionek/notify-microsoft-teams@master
      with:
        webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        title: "DealNDone 2025 - Deployment Status"
        summary: |
          **Branch:** ${{ github.event.workflow_run.head_branch }}
          **Commit:** ${{ github.event.workflow_run.head_sha }}
          **Status:** ${{ github.event.workflow_run.conclusion }}
          **Work Items:** ${{ steps.work-items.outputs.work_items }}
        themeColor: ${{ github.event.workflow_run.conclusion == 'success' && '00FF00' || 'FF0000' }}

  update-deployment-dashboard:
    name: Update Deployment Dashboard
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Update deployment metrics
      run: |
        # Update deployment dashboard in Azure DevOps
        DEPLOYMENT_METRICS=$(cat <<EOF
        {
          "deployment_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "branch": "${{ github.event.workflow_run.head_branch }}",
          "commit": "${{ github.event.workflow_run.head_sha }}",
          "environment": "${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}",
          "duration": "${{ github.event.workflow_run.run_duration }}",
          "status": "success"
        }
        EOF
        )
        
        # Store metrics in Azure DevOps (this would typically go to a custom dashboard)
        echo "$DEPLOYMENT_METRICS" > deployment-metrics.json
        
        # Upload as artifact for dashboard consumption
        echo "Deployment metrics saved for dashboard update"
    
    - name: Upload deployment metrics
      uses: actions/upload-artifact@v4
      with:
        name: deployment-metrics
        path: deployment-metrics.json
        retention-days: 30 