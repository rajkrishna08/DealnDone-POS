name: DealNDone 2025 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    name: Backend Tests (FastAPI + Pytest)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run backend tests
      run: |
        cd backend
        python -m pytest test_api.py -v
    
    - name: Test FastAPI endpoints
      run: |
        cd backend
        python test_api.py

  test-frontend:
    runs-on: ubuntu-latest
    name: Frontend Tests (React)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --watchAll=false --coverage

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan (OWASP ZAP)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run OWASP ZAP scan
      uses: zaproxy/action-full-scan@v0.8.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

  deploy-staging:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    name: Deploy to Staging (Azure Container Apps)
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Azure Container Apps
      run: |
        echo "Deploying to Azure Container Apps staging environment"
        # Azure deployment commands will be added here

  deploy-production:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    name: Deploy to Production (Multi-Region Azure Container Apps)
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        region: [eastus, southeastasia, westeurope]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Container Apps - ${{ matrix.region }}
      run: |
        echo "Deploying to Azure Container Apps in ${{ matrix.region }}"
        
        # Set Azure CLI to use the specific region
        az configure --defaults location=${{ matrix.region }}
        
        # Deploy backend
        az containerapp up \
          --name dealndone-backend-${{ matrix.region }} \
          --resource-group dealndone-rg-${{ matrix.region }} \
          --source backend \
          --location ${{ matrix.region }} \
          --environment dealndone-env-${{ matrix.region }} \
          --registry-server ${{ secrets.REGISTRY_LOGIN_SERVER }} \
          --registry-username ${{ secrets.REGISTRY_USERNAME }} \
          --registry-password ${{ secrets.REGISTRY_PASSWORD }}
        
        # Deploy frontend
        az containerapp up \
          --name dealndone-frontend-${{ matrix.region }} \
          --resource-group dealndone-rg-${{ matrix.region }} \
          --source frontend \
          --location ${{ matrix.region }} \
          --environment dealndone-env-${{ matrix.region }} \
          --registry-server ${{ secrets.REGISTRY_LOGIN_SERVER }} \
          --registry-username ${{ secrets.REGISTRY_USERNAME }} \
          --registry-password ${{ secrets.REGISTRY_PASSWORD }}
    
    - name: Configure Traffic Manager
      if: matrix.region == 'eastus'
      run: |
        echo "Configuring Azure Traffic Manager for multi-region load balancing"
        
        # Create Traffic Manager profile
        az network traffic-manager profile create \
          --name dealndone-tm \
          --resource-group dealndone-rg-eastus \
          --routing-method Performance \
          --unique-dns-name dealndone2025
        
        # Add endpoints for each region
        az network traffic-manager endpoint create \
          --name eastus-endpoint \
          --profile-name dealndone-tm \
          --resource-group dealndone-rg-eastus \
          --type externalEndpoints \
          --target dealndone-frontend-eastus.azurecontainerapps.io \
          --priority 1
        
        az network traffic-manager endpoint create \
          --name southeastasia-endpoint \
          --profile-name dealndone-tm \
          --resource-group dealndone-rg-eastus \
          --type externalEndpoints \
          --target dealndone-frontend-southeastasia.azurecontainerapps.io \
          --priority 2
        
        az network traffic-manager endpoint create \
          --name westeurope-endpoint \
          --profile-name dealndone-tm \
          --resource-group dealndone-rg-eastus \
          --type externalEndpoints \
          --target dealndone-frontend-westeurope.azurecontainerapps.io \
          --priority 3 