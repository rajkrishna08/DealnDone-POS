<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealNDone - Men's Garments POS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .online {
            background-color: #d4edda;
            color: #155724;
        }
        .offline {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DealNDone POS</h1>
        <div id="status" class="status">Checking API status...</div>
        
        <form id="saleForm">
            <div class="form-group">
                <label for="productId">Product ID:</label>
                <select id="productId" required>
                    <option value="">Select a product...</option>
                    <option value="shirt_001">Dress Shirt - $25.00</option>
                    <option value="shirt_002">Casual Shirt - $20.00</option>
                    <option value="shirt_003">Polo Shirt - $22.50</option>
                    <option value="pants_001">Dress Pants - $35.00</option>
                    <option value="jacket_001">Blazer - $75.00</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" value="1" min="1" required>
            </div>
            
            <button type="submit">Process Sale</button>
        </form>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        // Check API status
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('status').innerHTML = '✅ API Online';
                document.getElementById('status').className = 'status online';
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ API Offline - Start the server with: python main.py';
                document.getElementById('status').className = 'status offline';
            }
        }
        
        // Handle form submission
        document.getElementById('saleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productId = document.getElementById('productId').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            
            const saleData = {
                items: [{
                    id: productId,
                    quantity: quantity
                }]
            };
            
            try {
                const response = await fetch(`${API_BASE}/sales`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(saleData)
                });
                
                const result = await response.json();
                const resultDiv = document.getElementById('result');
                
                if (result.status === 'success') {
                    resultDiv.innerHTML = `
                        <strong>✅ Sale Successful!</strong><br>
                        <strong>Total: $${result.total.toFixed(2)}</strong><br>
                        Items Processed: ${result.items_processed}<br>
                        ${result.message}
                    `;
                    resultDiv.className = 'result success';
                    
                    // Reset form after successful sale
                    document.getElementById('quantity').value = '1';
                } else {
                    resultDiv.innerHTML = `
                        <strong>❌ Error:</strong><br>
                        ${result.detail || result.message || 'Unknown error occurred'}
                    `;
                    resultDiv.className = 'result error';
                }
                
                resultDiv.style.display = 'block';
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                    <strong>❌ Connection Error:</strong><br>
                    Make sure the server is running on localhost:8000
                `;
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
            }
        });
        
        // Check status on page load
        checkStatus();
        
        // Check status every 10 seconds
        setInterval(checkStatus, 10000);
    </script>
</body>
</html>
